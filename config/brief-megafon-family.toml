# Чек-лист брифа МегаФона «Связь для близких и собственных устройств» (пример брифа номинации «ИИ-проект», 20.11.2026).
# Сдаётся один документ outputs/report.md: резюме в начале и пять частей. Каждый пункт ищется регулярным выражением
# (без учёта регистра) только внутри своей части, поэтому пункт нельзя закрыть словом из чужого раздела.
# Файл входит в правила: ослабить чек-лист можно только с новым rules lock от человека.

id = "megafon-family"
title = "Бриф МегаФона: связь для близких и собственных устройств"
file = "report.md"

[summary]
heading = 'резюме|коротко'
max_words = 220
need = [
  { label = "первые клиенты", pattern = 'клиент|семь|владел' },
  { label = "проблема", pattern = 'проблем|не замеча|теря' },
  { label = "предложение", pattern = 'предлага|предложени|услуг' },
  { label = "ожидаемый результат", pattern = 'ожида|результат|прибыл' },
]

[[part]]
heading = 'клиент\w* и проблем'
need = [
  { label = "восстановлен один случай: последний момент, когда связь работала", pattern = 'последн\w* момент' },
  { label = "в случае назван сигнал и к кому обратились", pattern = 'сигнал' },
  { label = "момент, когда оператор ещё мог помочь", pattern = 'оператор\w*\s+(ещё\s+|еще\s+)?(мог|мож)' },
  { label = "сигнал отделён от причины", pattern = 'причин' },
  { label = "отставание базового года разложено: 4 000 групп при плане 5 000", pattern = '4[\s  ]?000.*5[\s  ]?000|5[\s  ]?000.*4[\s  ]?000' },
  { label = "отставание по прибыли: 275 млн при плане 282", pattern = '275.*282|282.*275' },
  { label = "сравнение с серьёзной альтернативной проблемой", pattern = 'альтернатив|второ\w+ групп|вместо' },
  { label = "сколько клиентов, частота, тяжесть, доля успевающей помощи", pattern = 'частот' },
  { label = "проверяемое предположение", pattern = 'предположени|гипотез' },
  { label = "допущения названы допущениями", pattern = 'допущени' },
  { label = "диапазон вместо точки", pattern = 'диапазон|от\s+\d[\d\s  ]*\s+до\s+\d' },
  { label = "условие смены приоритета", pattern = 'смен\w* приоритет|приоритет\w* смен|если .*(окажется|будет).*(перейд|выбер|смен)' },
]

[[part]]
heading = 'предложени\w* и путь'
need = [
  { label = "услуга глазами пользователя и обещание", pattern = 'обещ' },
  { label = "на каких тарифах и с чьего согласия", pattern = 'тариф' },
  { label = "согласие участника", pattern = 'соглас' },
  { label = "путь организатора и участника", pattern = 'организатор' },
  { label = "приглашение без ответа", pattern = 'без ответа|не отвеча|не принял' },
  { label = "отказ и отзыв согласия", pattern = 'отзыв|отозва' },
  { label = "доступ к остатку отдельно от доступа к начислениям", pattern = 'начислени' },
  { label = "одна операция до конца: передача интернета или платёж", pattern = 'переда\w+ интернет|платёж|платеж' },
  { label = "повторное нажатие не списывает дважды", pattern = 'дважды|повторн\w* нажат|двойн\w* списан' },
  { label = "сравнение с заменителями (семейный тариф, автоплатёж, чат, приложение роутера)", pattern = 'автоплат|заменител' },
  { label = "состав первого запуска", pattern = 'первого запуска|первый запуск|в запуск' },
  { label = "тест удобства: одна задача старым и новым способом, порядок меняется", pattern = 'порядок\s+\w*\s*(меня|чередуе)|чередов|старым и новым' },
  { label = "воронка от доступной базы: 100 тыс. домохозяйств", pattern = '100\s*тыс|100[\s  ]?000' },
  { label = "воронка: 40 тыс. владельцев", pattern = '40\s*тыс|40[\s  ]?000' },
  { label = "каналы: приложение, продажи, поддержка, рекомендации", pattern = 'рекомендац' },
  { label = "без двойного счёта", pattern = 'двойн\w* сч|дважды не|не считаем дважды|пересечени' },
  { label = "инкремент к обычному обслуживанию", pattern = 'инкремент|сверх обычн|дополнительн\w* к' },
  { label = "цель 12 000 групп = +5 500 к 6 500, разрыв 4 000", pattern = '12[\s  ]?000' },
  { label = "чистый прирост 5 500 к начальным 6 500", pattern = '6[\s  ]?500' },
  { label = "при обычном обслуживании 8 000 групп, разрыв к цели 4 000", pattern = '8[\s  ]?000[\s\S]*4[\s  ]?000|4[\s  ]?000[\s\S]*8[\s  ]?000' },
  { label = "сведение: на начало года + новые подключения − выбывшие", pattern = 'выбыв|уход' },
  { label = "владельцы нескольких номеров посчитаны отдельно (1 000 без изменений, цель 2 000)", pattern = 'владел\w*[\s\S]{0,200}(1[\s  ]?000|2[\s  ]?000)|(1[\s  ]?000|2[\s  ]?000)[\s\S]{0,200}владел' },
  { label = "активность: 8 000 из 12 000 = 2/3 против 62,5 %", pattern = '62[,.]5' },
]

[[part]]
heading = 'польз\w* и прибыл'
need = [
  { label = "один главный результат и его признак", pattern = 'главн\w* результат|основн\w* результат' },
  { label = "таблица: польза для клиента, работа услуги, нежелательные последствия", pattern = 'нежелательн' },
  { label = "порог пользы до запуска (12 % → 9 %: 3 п. п. и −25 %)", pattern = 'п\.\s?п\.|процентн\w+ пункт' },
  { label = "критерии включения в пилот", pattern = 'критери\w* включени|включаем' },
  { label = "первый подходящий случай одинаково регистрируется в обеих группах", pattern = 'первый подходящ|первого подходящ|в обеих группах' },
  { label = "рандомизация по семье и по владельцу", pattern = 'рандомиз\w*\s+(\w+\s+){0,2}сем|по семь|по семьям' },
  { label = "анализ всех включённых, а не только откликнувшихся", pattern = 'всех включ|ITT|intention' },
  { label = "размер выборки", pattern = 'размер\w* выборк|выборк\w* в' },
  { label = "темп набора в неделю", pattern = 'в неделю|темп набор' },
  { label = "время наблюдения за последними участниками добавлено к сроку набора", pattern = 'наблюдени' },
  { label = "что делать по результату пилота", pattern = 'по результат|если пилот|если эффект' },
  { label = "при расширении сохраняется группа сравнения", pattern = 'групп\w* сравнени' },
  { label = "прибыль 279 → цель 285 млн, не хватает 6 млн", pattern = '279' },
  { label = "500 руб. валовой прибыли за дополнительный оплаченный месяц", pattern = '500\s*(руб|₽)' },
  { label = "12 000 дополнительных оплаченных месяцев", pattern = 'оплаченн\w* месяц' },
  { label = "экономия поддержки только по реально исчезающим затратам", pattern = 'исчеза|реальн\w* (уход|снижа)|только .*затрат' },
  { label = "окупаемость по кварталам", pattern = 'окупа' },
  { label = "предельная сумма вложений", pattern = 'предельн|не более|максимальн\w* (сумм|вложен)' },
]

[[part]]
heading = 'выбор|план по квартал'
need = [
  { label = "сравнение с путём «оставить как есть»", pattern = 'как есть|без изменений' },
  { label = "сравнение с серьёзной альтернативой", pattern = 'альтернатив' },
  { label = "таблица Q1–Q4: что станет известно → какое решение", pattern = 'Q1[\s\S]*Q2[\s\S]*Q3[\s\S]*Q4' },
  { label = "прогноз по всем пяти строкам: прибыль, активные, подключённые группы, владельцы, активация за 14 дней", pattern = '14 дн' },
  { label = "основной ход прогноза", pattern = 'основн\w* (ход|сценари)' },
  { label = "неблагоприятный ход прогноза", pattern = 'неблагоприятн' },
  { label = "каждая разница с «без изменений» связана с действием и допущением", pattern = 'допущени' },
  { label = "для недостижимой цели: разрыв, цена, решение", pattern = 'недостижим|не достига|разрыв' },
  { label = "ориентир на конец третьего года (числитель, база, условие)", pattern = 'трет\w+ год|3-го года|2029' },
]

[[part]]
heading = 'ресурс\w*,? риск|риск\w* и решени'
need = [
  { label = "человеко-месяцы", pattern = 'чел\.?[\s-]*мес|человеко-месяц' },
  { label = "календарь по кварталам", pattern = 'Q1|Q2|календар' },
  { label = "дизайнер и аналитик по 0,5 ставки ещё не выделены", pattern = '0[,.]5' },
  { label = "ответственные и сроки зависимостей (расчёты, кабинет, безопасность, поддержка)", pattern = 'безопасн' },
  { label = "риск: видимость после отзыва согласия → стоп пилота", pattern = 'отзыв' },
  { label = "риск: двойное списание → стоп спорных операций, сверка", pattern = 'сверк|двойн\w* списан' },
  { label = "риск: малый набор в пилот", pattern = 'набор' },
  { label = "риск: нет прироста оплаченных месяцев", pattern = 'оплаченн\w* месяц' },
  { label = "у рисков признак, последствие, ответственный и действие", pattern = 'ответственн' },
  { label = "просьба руководителю на Q1", pattern = 'прош\w*|просьб|просим' },
  { label = "что руководитель увидит в Q2", pattern = 'Q2' },
]
