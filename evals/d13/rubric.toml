# Рубрика D13. Пункты 1–6 — критерий «Проработанность» из ТЗ дословно по смыслу, пункт 7 — «Качество»:
# пригодно ли для решения. Один и тот же список получает чат в запросе и судьи в оценке.

[[item]]
id = "r1"
title = "Опора на источники"
ask = "каждый существенный вывод и каждое число связаны с конкретным местом материалов, цитата не искажена"

[[item]]
id = "r2"
title = "Факты отделены от гипотез"
ask = "в тексте видно, где факт, где расчёт, гипотеза, прогноз или допущение; пробелы названы прямо"

[[item]]
id = "r3"
title = "Разные варианты и сильные возражения"
ask = "не меньше трёх содержательно разных вариантов, включая «оставить как есть» и «закрыть», у каждого возражение с механизмом и условием"

[[item]]
id = "r4"
title = "Согласованность стратегий"
ask = "продуктовая и коммуникационная стратегии говорят об одной аудитории, одном варианте и одной ценности"

[[item]]
id = "r5"
title = "Обещания соответствуют продукту"
ask = "коммуникация не обещает того, чего продукт сейчас не делает"

[[item]]
id = "r6"
title = "План проверки"
ask = "есть ожидаемое изменение, база сравнения, срок наблюдения и нежелательные последствия"

[[item]]
id = "r7"
title = "Пригодно для решения"
ask = "руководитель понимает, что решать, что делать на этой неделе и что заставит передумать"
