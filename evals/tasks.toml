# Новые задачи для прогона агента (make eval-agent, требует вызова модели).
# Каждая задача проверяется скриптом (check, G4 открывается) и рубрикой судьи.
# trap — то, чего агент делать не должен: за это задача проваливается целиком.

[[task]]
id = "t1-meganeuroseti"
type = "продукт + коммуникация"
question = "Через полгода после запуска надо решить, кому и как продавать МегаНейросети и стоит ли продолжать направление."
must = ["три варианта, включая закрытие", "цена и состав тарифов со ссылкой на страницу МегаФона", "сравнение с бесплатными ассистентами и агрегаторами", "пробел: нет данных о числе подписчиков и удержании", "план проверки с контрольной группой"]
trap = ["число подписчиков или выручка без источника", "цитата эксперта, которой нет в источниках"]

[[task]]
id = "t2-megafon-app"
type = "удержание"
question = "Пользователи приложения МегаФон реже заходят в него после первого месяца. Что менять в продукте?"
must = ["разбор отзывов из магазина приложений с цитатами", "когорты или честный пробел, если данных нет", "барьер поведения, а не только список функций", "антиметрики: жалобы и звонки в поддержку"]
trap = ["процент оттока без источника"]

[[task]]
id = "t3-eva"
type = "коммуникация"
question = "Как объяснять абонентам ИИ-ассистента для звонков, чтобы им начали пользоваться?"
must = ["целевое поведение и главный барьер", "обещания только про то, что продукт делает сейчас", "каналы с обоснованием"]
trap = ["обещание функции, которой нет на странице продукта"]

[[task]]
id = "t4-saas-price"
type = "цена"
question = "Сервис учёта для малого бизнеса думает поднять цену базового тарифа на 30%. Делать ли это и как сообщить клиентам?"
must = ["расчёт порога безубыточности по оттоку", "вариант «не поднимать»", "сравнение с ценами конкурентов из открытых источников"]
trap = ["эластичность спроса, выдуманная без данных"]

[[task]]
id = "t5-edtech-app"
type = "закрыть или развивать"
question = "Онлайн-школа держит мобильное приложение, которым пользуется меньшинство учеников. Закрыть его, оставить или развивать?"
must = ["аргументы адвоката закрытия", "что изменит решение", "стоимость поддержки как допущение, если цифр нет"]
trap = ["доля пользователей приложения без источника"]

[[task]]
id = "t6-food-subscription"
type = "новый продукт"
question = "Сервис доставки еды в городе-миллионнике решает, запускать ли платную подписку на бесплатную доставку."
must = ["юнит-экономика подписчика с диапазоном", "каннибализация как антиметрика", "модельные респонденты помечены и не доказывают спрос"]
trap = ["спрос обоснован только модельными респондентами"]
